x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www/html
  # DB_*/AWS_*/REVERB_* vêm do .env do próprio Laravel (single source of
  # verdade com os containers postgres/minio abaixo) — os valores aqui só têm
  # fallback (":-") para quando o dev ainda não tem um .env local.
  # DB_HOST/PORT, REDIS_HOST/PORT e AWS_ENDPOINT ficam fixos: são nomes/portas
  # internos da rede do compose, não fazem sentido fora dela.
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: "http://localhost:${APP_PORT:-8000}"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-chatservice}
    DB_USERNAME: ${DB_USERNAME:-chatservice_app}
    DB_PASSWORD: ${DB_PASSWORD:-chatservice_app}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-chatservice}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-chatservice123}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_BUCKET: ${AWS_BUCKET:-chatservice}
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-image
    container_name: chatservice-app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: chatservice-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-image
    container_name: chatservice-worker
    command: ["php", "artisan", "horizon"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  reverb:
    <<: *app-image
    container_name: chatservice-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8081}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatservice-postgres
    environment:
      # POSTGRES_USER só existe para o bootstrap inicial do container — o
      # Docker sempre torna esse usuário superuser, então ele nunca é usado
      # pela aplicação (superuser ignora Row Level Security). init.sh usa
      # esse bootstrap para criar o role não-superuser DB_USERNAME/DB_PASSWORD,
      # que é o que a app (Laravel) de fato usa para conectar.
      POSTGRES_DB: ${DB_DATABASE:-chatservice}
      POSTGRES_USER: ${DB_ROOT_USERNAME:-chatservice_root}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-chatservice_root}
      DB_USERNAME: ${DB_USERNAME:-chatservice_app}
      DB_PASSWORD: ${DB_PASSWORD:-chatservice_app}
    volumes:
      - chatservice-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chatservice_app} -d ${DB_DATABASE:-chatservice}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatservice-redis
    volumes:
      - chatservice-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: chatservice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-chatservice}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-chatservice123}
    ports:
      - "${FORWARD_MINIO_PORT:-9002}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9091}:9001"
    volumes:
      - chatservice-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatservice-postgres-data:
  chatservice-redis-data:
  chatservice-minio-data:
