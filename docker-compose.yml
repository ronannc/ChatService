x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www/html
  # Credenciais fixas abaixo são válidas apenas para este ambiente 100% local
  # (nunca usado em deploy real) — não reaproveitar em outro compose file.
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: chatservice
    DB_USERNAME: chatservice
    DB_PASSWORD: chatservice
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: chatservice
    AWS_SECRET_ACCESS_KEY: chatservice123
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: chatservice
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-image
    container_name: chatservice-app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: chatservice-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-image
    container_name: chatservice-worker
    command: ["php", "artisan", "horizon"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  reverb:
    <<: *app-image
    container_name: chatservice-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8081:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatservice-postgres
    environment:
      POSTGRES_DB: chatservice
      POSTGRES_USER: chatservice
      POSTGRES_PASSWORD: chatservice
    volumes:
      - chatservice-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatservice -d chatservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatservice-redis
    volumes:
      - chatservice-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: chatservice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chatservice
      MINIO_ROOT_PASSWORD: chatservice123
    ports:
      - "9002:9000"
      - "9091:9001"
    volumes:
      - chatservice-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatservice-postgres-data:
  chatservice-redis-data:
  chatservice-minio-data:
